<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renjana Cell — Pencatatan Keuangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F3F5F8; --surface:#FFFFFF; --ink:#101B33; --ink-soft:#5B6478;
    --primary:#16234A; --primary-2:#233865;
    --accent:#0D9C7F; --accent-soft:#E4F5EF;
    --amber:#B4761C; --amber-soft:#FBF0DC;
    --danger:#C6402F; --danger-soft:#FBEAE7;
    --blue:#1179C9; --blue-soft:#E7F0FB;
    --line:#E3E7EE; --radius-card:14px; --radius-btn:9px;
    --shadow:0 1px 2px rgba(16,27,51,.04), 0 8px 24px -12px rgba(16,27,51,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select{font-family:inherit;}

  .wrap{max-width:920px;margin:0 auto;padding:22px 18px 90px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(155deg,var(--accent),#0B7B65);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px;flex-shrink:0;}
  .brand .name{font-weight:800;font-size:17px;letter-spacing:-.01em;}
  .brand .tag{font-size:11.5px;color:var(--ink-soft);}
  .who{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-soft);}
  .who b{color:var(--ink);}

  .btn{border:none;border-radius:var(--radius-btn);padding:10px 16px;font-size:13.5px;font-weight:600;transition:transform .08s,opacity .15s;}
  .btn:active{transform:scale(.97);}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover{opacity:.92;}
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:hover{opacity:.92;}
  .btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:#C7CEDC;}
  .btn-danger-line{background:#fff;border:1px solid #F0C4BC;color:var(--danger);}
  .btn-full{width:100%;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px;}

  .hero{background:linear-gradient(120deg,var(--primary),var(--primary-2));border-radius:16px;padding:22px 24px;color:#fff;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
  .hero .lbl{font-size:12.5px;color:#AFC0E6;margin-bottom:6px;}
  .hero .amt{font-size:30px;font-weight:800;letter-spacing:-.01em;}
  .hero .note{font-size:12px;color:#93A6D2;margin-top:5px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:14px 15px;}
  .stat-card .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
  .stat-card .val{font-size:16.5px;font-weight:800;}
  .stat-card.pos .val{color:#0B7B65;}
  .stat-card.neg .val{color:var(--danger);}

  .tabs{display:flex;gap:4px;background:#E9EBF1;padding:4px;border-radius:11px;margin-bottom:18px;width:fit-content;}
  .tab{border:none;background:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .tab.active{background:#fff;color:var(--ink);box-shadow:var(--shadow);}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px;margin-bottom:16px;}
  .panel h3{font-size:14.5px;margin:0 0 14px;}

  .chart-row{display:flex;align-items:flex-end;gap:10px;height:120px;padding-top:10px;}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;}
  .chart-bar{width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:3px;transition:height .3s ease;}
  .chart-bar.neg{background:var(--danger);}
  .chart-col .day{font-size:10.5px;color:var(--ink-soft);font-weight:600;}

  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{border:1.5px solid var(--line);background:#fff;padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .chip.active{border-color:var(--primary);background:#F0F3FA;color:var(--ink);}

  .ledger-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);overflow:hidden;}
  .ledger-row{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);}
  .ledger-row:last-child{border-bottom:none;}
  .badge{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .badge.jual{background:var(--accent-soft);color:#0B7B65;}
  .badge.keluar{background:var(--danger-soft);color:var(--danger);}
  .badge.masuk{background:var(--blue-soft);color:var(--blue);}
  .ledger-row .info{flex:1;min-width:0;}
  .ledger-row .title{font-size:13.5px;font-weight:600;}
  .ledger-row .meta{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
  .ledger-row .right{text-align:right;flex-shrink:0;}
  .ledger-row .amt{font-size:13.5px;font-weight:700;}
  .amt.pos{color:#0B7B65;}
  .amt.neg{color:var(--danger);}
  .confirm-inline{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);}
  .icon-btn{border:none;background:none;color:var(--ink-soft);font-size:13px;padding:3px;}
  .icon-btn:hover{color:var(--danger);}

  .empty{padding:40px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}

  .fab{position:fixed;right:22px;bottom:22px;background:var(--accent);color:#fff;border:none;border-radius:99px;padding:14px 20px;font-size:14px;font-weight:700;box-shadow:0 10px 24px -8px rgba(13,156,127,.55);z-index:30;display:flex;align-items:center;gap:8px;}
  .fab:hover{opacity:.94;}

  .overlay{position:fixed;inset:0;background:rgba(16,27,51,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px;}
  .modal{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 4px;font-size:16.5px;}
  .modal .sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;}
  .type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;}
  .type-opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 8px;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .type-opt.active{border-color:var(--primary);background:#F0F3FA;color:var(--ink);}
  .field-label{font-size:12px;font-weight:600;color:var(--ink-soft);display:block;margin:12px 0 6px;}
  .field-input,.field-select{width:100%;padding:10px 12px;border-radius:9px;border:1.5px solid var(--line);font-size:14px;font-family:inherit;color:var(--ink);background:#FBFCFE;}
  .field-input:focus,.field-select:focus{outline:none;border-color:var(--primary);background:#fff;}
  .laba-preview{margin-top:12px;background:var(--accent-soft);border-radius:9px;padding:10px 13px;display:flex;justify-content:space-between;font-size:12.5px;color:#0B7B65;font-weight:700;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;}
  .toast.show{opacity:1;}

  .loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:14px;color:var(--ink-soft);font-size:13px;}
  .spinner{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .footlink{background:none;border:none;color:var(--ink-soft);font-size:11.5px;text-decoration:underline;padding:0;}

  /* ---- Auth screen ---- */
  .auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;}
  .auth-brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px;}
  .auth-tabs{display:flex;gap:4px;background:#E9EBF1;padding:4px;border-radius:11px;margin-bottom:18px;}
  .auth-tabs button{flex:1;border:none;background:none;padding:9px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-soft);}
  .auth-tabs button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow);}
  .auth-err{background:var(--danger-soft);color:var(--danger);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-top:12px;}
  .auth-ok{background:var(--accent-soft);color:#0B7B65;font-size:12.5px;padding:9px 12px;border-radius:8px;margin-top:12px;}

  @media (max-width:640px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .hero{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="loading-screen"><div class="spinner"></div><div>Memuat Renjana Cell…</div></div>
</div>

<button class="fab" id="fabAdd" style="display:none">+ &nbsp;Tambah Transaksi</button>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   KONFIGURASI SUPABASE — wajib diisi sebelum digunakan
   Ambil dari: Supabase Dashboard > Project Settings > API
   ============================================================ */
const SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================ */

const rupiah = n => (n<0?'-':'') + 'Rp' + Math.abs(n).toLocaleString('id-ID');
const todayStr = () => new Date().toISOString().slice(0,10);

const SALE_CATS = ['Pulsa','Paket Data','Token PLN','E-Wallet','Tagihan/PDAM','Voucher Game','Lainnya'];
const EXPENSE_CATS = ['Operasional','Sewa Tempat','Transport','Kuota/Listrik Toko','Gaji Karyawan','Lainnya'];

const state = {
  session: null,
  entries: [],
  tab: 'ringkasan',
  dateFilter: 'semua',
  typeFilter: 'semua',
  loaded: false,
  modalOpen: false,
  saving: false,
  form: null,
  confirmDeleteId: null,
  confirmingReset: false,
  authMode: 'signin',
  authError: '',
  authInfo: '',
  authBusy: false,
};

/* ---------- CONFIG GUARD ---------- */
function isConfigured(){
  return !SUPABASE_URL.includes('YOUR-PROJECT') && !SUPABASE_ANON_KEY.includes('YOUR-ANON');
}

/* ---------- AUTH ---------- */
async function initAuth(){
  if(!isConfigured()){
    renderConfigMissing();
    return;
  }
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  state.loaded = true;

  sb.auth.onAuthStateChange((_event, session)=>{
    state.session = session;
    if(session){ loadEntries(); subscribeRealtime(); }
    else { state.entries = []; render(); }
  });

  if(state.session){ await loadEntries(); subscribeRealtime(); }
  else { render(); }
}

function renderConfigMissing(){
  document.getElementById('app').innerHTML = `
    <div class="auth-screen">
      <div class="auth-card">
        <div class="auth-brand">
          <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(155deg,#0D9C7F,#0B7B65);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px">RC</div>
          <div><div style="font-weight:800;font-size:16px">Renjana Cell</div></div>
        </div>
        <div class="auth-err">
          Konfigurasi Supabase belum diisi. Buka file <b>index.html</b>, cari <b>SUPABASE_URL</b> dan <b>SUPABASE_ANON_KEY</b> di bagian atas &lt;script&gt;, lalu isi dengan nilai dari Supabase Dashboard &gt; Project Settings &gt; API. Lihat README.md untuk langkah lengkap.
        </div>
      </div>
    </div>`;
}

async function handleAuthSubmit(email, password){
  state.authError=''; state.authInfo=''; state.authBusy=true; render();
  try{
    if(state.authMode==='signin'){
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
    } else {
      const { error } = await sb.auth.signUp({ email, password });
      if(error) throw error;
      state.authInfo = 'Akun dibuat. Jika verifikasi email aktif di project Anda, cek inbox sebelum masuk.';
    }
  }catch(e){
    state.authError = e.message || 'Terjadi kesalahan, coba lagi.';
  }
  state.authBusy=false;
  render();
}
async function handleSignOut(){
  await sb.auth.signOut();
  state.entries = [];
  render();
}

/* ---------- DATA (Supabase) ---------- */
async function loadEntries(){
  const { data, error } = await sb
    .from('transactions')
    .select('*')
    .order('date', { ascending:false })
    .order('created_at', { ascending:false });
  if(error){ toast('Gagal memuat data: ' + error.message); return; }
  state.entries = data || [];
  render();
}

let realtimeChannel = null;
function subscribeRealtime(){
  if(realtimeChannel) return;
  realtimeChannel = sb.channel('transactions-changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'transactions' }, ()=>{
      loadEntries();
    })
    .subscribe();
}

async function insertEntry(entry){
  const { error } = await sb.from('transactions').insert(entry);
  if(error){ toast('Gagal menyimpan: ' + error.message); return false; }
  return true;
}
async function deleteEntry(id){
  const { error } = await sb.from('transactions').delete().eq('id', id);
  if(error){ toast('Gagal menghapus: ' + error.message); return false; }
  return true;
}
async function deleteAllEntries(){
  const ids = state.entries.map(e=>e.id);
  if(ids.length===0) return true;
  const { error } = await sb.from('transactions').delete().in('id', ids);
  if(error){ toast('Gagal menghapus semua data: ' + error.message); return false; }
  return true;
}

/* ---------- CALC HELPERS ---------- */
function cashEffect(e){
  if(e.type==='penjualan') return (Number(e.jual) - Number(e.modal));
  if(e.type==='pengeluaran') return -Number(e.amount);
  if(e.type==='modal_masuk') return Number(e.amount);
  if(e.type==='modal_keluar') return -Number(e.amount);
  return 0;
}
function saldoKas(){ return state.entries.reduce((s,e)=>s+cashEffect(e),0); }
function inMonth(dateStr, d){ return dateStr.slice(0,7) === d.slice(0,7); }
function isToday(dateStr){ return dateStr === todayStr(); }
function startOfWeek(){
  const d = new Date(); const day = d.getDay()===0?7:d.getDay();
  d.setDate(d.getDate()-day+1); return d.toISOString().slice(0,10);
}
function monthStats(){
  const nowMonth = todayStr();
  const list = state.entries.filter(e=>inMonth(e.date, nowMonth));
  let omzet=0, modal=0, pengeluaran=0, labaBersih=0, jumlah=list.length;
  list.forEach(e=>{
    if(e.type==='penjualan'){ omzet+=Number(e.jual); modal+=Number(e.modal); labaBersih += (Number(e.jual)-Number(e.modal)); }
    if(e.type==='pengeluaran'){ pengeluaran+=Number(e.amount); labaBersih -= Number(e.amount); }
  });
  return {omzet, modal, pengeluaran, labaBersih, jumlah};
}
function last7DaysProfit(){
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const label = d.toLocaleDateString('id-ID',{weekday:'short'});
    const profit = state.entries.filter(e=>e.date===key)
      .reduce((s,e)=> s + (e.type==='penjualan' ? (Number(e.jual)-Number(e.modal)) : e.type==='pengeluaran' ? -Number(e.amount) : 0), 0);
    days.push({key,label,profit});
  }
  return days;
}

/* ---------- UI HELPERS ---------- */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__tt);
  window.__tt = setTimeout(()=>t.classList.remove('show'), 2400);
}
function typeLabel(t){
  return {penjualan:'Penjualan', pengeluaran:'Pengeluaran', modal_masuk:'Setor Modal', modal_keluar:'Ambil Kas'}[t];
}
function typeBadge(t){
  if(t==='penjualan') return {cls:'jual', ic:'&#8593;'};
  if(t==='pengeluaran') return {cls:'keluar', ic:'&#8595;'};
  if(t==='modal_masuk') return {cls:'masuk', ic:'&#43;'};
  return {cls:'keluar', ic:'&#8722;'};
}

/* ---------- RENDER ROOT ---------- */
function render(){
  if(!isConfigured()) return;
  if(!state.loaded) return;
  if(!state.session) return renderAuth();
  return renderApp();
}

function renderAuth(){
  document.getElementById('fabAdd').style.display = 'none';
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="auth-screen">
      <div class="auth-card">
        <div class="auth-brand">
          <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(155deg,#0D9C7F,#0B7B65);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px">RC</div>
          <div>
            <div style="font-weight:800;font-size:16px">Renjana Cell</div>
            <div style="font-size:11.5px;color:var(--ink-soft)">Pencatatan keuangan usaha</div>
          </div>
        </div>
        <div class="auth-tabs">
          <button id="tabSignin" class="${state.authMode==='signin'?'active':''}">Masuk</button>
          <button id="tabSignup" class="${state.authMode==='signup'?'active':''}">Daftar Akun</button>
        </div>
        <label class="field-label" style="margin-top:0">Email</label>
        <input class="field-input" id="authEmail" type="email" placeholder="nama@email.com">
        <label class="field-label">Kata Sandi</label>
        <input class="field-input" id="authPass" type="password" placeholder="Minimal 6 karakter">
        <button class="btn btn-accent btn-full" id="authSubmit" style="margin-top:16px" ${state.authBusy?'disabled':''}>
          ${state.authBusy ? 'Memproses…' : (state.authMode==='signin' ? 'Masuk' : 'Buat Akun')}
        </button>
        ${state.authError ? `<div class="auth-err">${state.authError}</div>` : ''}
        ${state.authInfo ? `<div class="auth-ok">${state.authInfo}</div>` : ''}
      </div>
    </div>
  `;
  app.querySelector('#tabSignin').addEventListener('click', ()=>{ state.authMode='signin'; state.authError=''; state.authInfo=''; render(); });
  app.querySelector('#tabSignup').addEventListener('click', ()=>{ state.authMode='signup'; state.authError=''; state.authInfo=''; render(); });
  app.querySelector('#authSubmit').addEventListener('click', ()=>{
    const email = app.querySelector('#authEmail').value.trim();
    const pass = app.querySelector('#authPass').value;
    if(!email || !pass){ state.authError = 'Isi email dan kata sandi terlebih dahulu.'; render(); return; }
    handleAuthSubmit(email, pass);
  });
}

function renderApp(){
  document.getElementById('fabAdd').style.display = 'flex';
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="wrap">
      <div class="topbar">
        <div class="brand">
          <div class="mark">RC</div>
          <div>
            <div class="name">Renjana Cell</div>
            <div class="tag">Pencatatan keuangan usaha pulsa &amp; PPOB</div>
          </div>
        </div>
        <div class="who">
          <span><b>${state.session.user.email}</b></span>
          <button class="btn btn-outline btn-sm" id="btnLogout">Keluar</button>
        </div>
      </div>

      <div class="hero">
        <div>
          <div class="lbl">Saldo Kas Usaha Saat Ini</div>
          <div class="amt mono">${rupiah(saldoKas())}</div>
          <div class="note">${state.entries.length} transaksi tercatat sepanjang waktu</div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab ${state.tab==='ringkasan'?'active':''}" data-tab="ringkasan">Ringkasan</button>
        <button class="tab ${state.tab==='bukukas'?'active':''}" data-tab="bukukas">Buku Kas</button>
      </div>

      <div id="tabBody"></div>
    </div>
  `;

  app.querySelector('#btnLogout').addEventListener('click', handleSignOut);
  app.querySelectorAll('[data-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.tab = el.getAttribute('data-tab'); render(); });
  });

  const body = document.getElementById('tabBody');
  if(state.tab==='ringkasan') renderRingkasan(body);
  else renderBukuKas(body);

  if(state.modalOpen) renderModal();
}

function renderRingkasan(body){
  const m = monthStats();
  const days = last7DaysProfit();
  const maxAbs = Math.max(1, ...days.map(d=>Math.abs(d.profit)));

  body.innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="lbl">Omzet Bulan Ini</div><div class="val mono">${rupiah(m.omzet)}</div></div>
      <div class="stat-card"><div class="lbl">Modal Terpakai</div><div class="val mono">${rupiah(m.modal)}</div></div>
      <div class="stat-card"><div class="lbl">Pengeluaran Lain</div><div class="val mono">${rupiah(m.pengeluaran)}</div></div>
      <div class="stat-card ${m.labaBersih>=0?'pos':'neg'}"><div class="lbl">Laba Bersih Bulan Ini</div><div class="val mono">${rupiah(m.labaBersih)}</div></div>
    </div>

    <div class="panel">
      <h3>Laba 7 Hari Terakhir</h3>
      <div class="chart-row" id="chartRow"></div>
    </div>

    <div class="panel">
      <h3>Transaksi Terbaru</h3>
      <div id="recentList"></div>
    </div>
  `;

  const chartRow = body.querySelector('#chartRow');
  days.forEach(d=>{
    const h = Math.max(4, Math.round((Math.abs(d.profit)/maxAbs)*90));
    const col = document.createElement('div');
    col.className = 'chart-col';
    col.innerHTML = `<div class="chart-bar ${d.profit<0?'neg':''}" style="height:${h}px" title="${rupiah(d.profit)}"></div><div class="day">${d.label}</div>`;
    chartRow.appendChild(col);
  });

  const recentList = body.querySelector('#recentList');
  const recent = [...state.entries].slice(0,5);
  if(recent.length===0){
    recentList.innerHTML = '<div class="empty">Belum ada transaksi. Tambahkan transaksi pertama Anda.</div>';
  } else {
    const card = document.createElement('div');
    card.className = 'ledger-card';
    recent.forEach(e=>card.appendChild(ledgerRow(e, false)));
    recentList.appendChild(card);
  }
}

function renderBukuKas(body){
  body.innerHTML = `
    <div class="filter-row" id="dateFilterRow"></div>
    <div class="filter-row" id="typeFilterRow"></div>
    <div class="ledger-card" id="ledgerList"></div>
    <div style="text-align:center;margin-top:18px">
      <button class="footlink" id="btnResetAll">Hapus semua data tersimpan</button>
    </div>
  `;

  const dateFilters = [['semua','Semua Tanggal'],['hari','Hari Ini'],['minggu','Minggu Ini'],['bulan','Bulan Ini']];
  const dfRow = body.querySelector('#dateFilterRow');
  dateFilters.forEach(([key,label])=>{
    const c = document.createElement('button');
    c.className = 'chip' + (state.dateFilter===key?' active':'');
    c.textContent = label;
    c.addEventListener('click', ()=>{ state.dateFilter = key; render(); });
    dfRow.appendChild(c);
  });

  const typeFilters = [['semua','Semua Tipe'],['penjualan','Penjualan'],['pengeluaran','Pengeluaran'],['modal_masuk','Setor Modal'],['modal_keluar','Ambil Kas']];
  const tfRow = body.querySelector('#typeFilterRow');
  typeFilters.forEach(([key,label])=>{
    const c = document.createElement('button');
    c.className = 'chip' + (state.typeFilter===key?' active':'');
    c.textContent = label;
    c.addEventListener('click', ()=>{ state.typeFilter = key; render(); });
    tfRow.appendChild(c);
  });

  let list = [...state.entries];
  const wk = startOfWeek();
  if(state.dateFilter==='hari') list = list.filter(e=>isToday(e.date));
  if(state.dateFilter==='minggu') list = list.filter(e=>e.date>=wk);
  if(state.dateFilter==='bulan') list = list.filter(e=>inMonth(e.date, todayStr()));
  if(state.typeFilter!=='semua') list = list.filter(e=>e.type===state.typeFilter);

  const ledgerList = body.querySelector('#ledgerList');
  if(list.length===0){
    ledgerList.innerHTML = '<div class="empty">Tidak ada transaksi pada filter ini.</div>';
  } else {
    list.forEach(e=>ledgerList.appendChild(ledgerRow(e, true)));
  }

  body.querySelector('#btnResetAll').addEventListener('click', async ()=>{
    if(state.confirmingReset){
      state.confirmingReset = false;
      const ok = await deleteAllEntries();
      if(ok){ toast('Semua data telah dihapus'); await loadEntries(); }
    } else {
      state.confirmingReset = true;
      const btn = body.querySelector('#btnResetAll');
      btn.textContent = 'Yakin? Klik sekali lagi untuk hapus semua';
      setTimeout(()=>{ state.confirmingReset=false; if(document.getElementById('btnResetAll')) document.getElementById('btnResetAll').textContent='Hapus semua data tersimpan'; }, 3000);
    }
  });
}

function ledgerRow(e, withActions){
  const row = document.createElement('div');
  row.className = 'ledger-row';
  const badge = typeBadge(e.type);
  const effect = cashEffect(e);
  const dateLabel = new Date(e.date+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});

  let title, meta;
  if(e.type==='penjualan'){
    title = e.category + (e.description ? ' — '+e.description : '');
    meta = `${dateLabel} · Modal ${rupiah(Number(e.modal))} · Jual ${rupiah(Number(e.jual))}`;
  } else if(e.type==='pengeluaran'){
    title = e.category + (e.description ? ' — '+e.description : '');
    meta = dateLabel;
  } else {
    title = typeLabel(e.type) + (e.description ? ' — '+e.description : '');
    meta = dateLabel;
  }

  row.innerHTML = `
    <div class="badge ${badge.cls}">${badge.ic}</div>
    <div class="info">
      <div class="title">${title}</div>
      <div class="meta">${meta}</div>
    </div>
    <div class="right">
      <div class="amt ${effect>=0?'pos':'neg'} mono">${rupiah(effect)}</div>
    </div>
  `;

  if(withActions){
    const actionsWrap = document.createElement('div');
    actionsWrap.style.marginLeft = '8px';
    if(state.confirmDeleteId === e.id){
      actionsWrap.innerHTML = `
        <div class="confirm-inline">
          <span>Hapus?</span>
          <button class="btn btn-sm btn-danger-line" data-yes>Ya</button>
          <button class="btn btn-sm btn-outline" data-no>Batal</button>
        </div>`;
      actionsWrap.querySelector('[data-yes]').addEventListener('click', async ()=>{
        const ok = await deleteEntry(e.id);
        state.confirmDeleteId = null;
        if(ok){ toast('Transaksi dihapus'); await loadEntries(); } else { render(); }
      });
      actionsWrap.querySelector('[data-no]').addEventListener('click', ()=>{ state.confirmDeleteId=null; render(); });
    } else {
      actionsWrap.innerHTML = `<button class="icon-btn" title="Hapus">&#128465;</button>`;
      actionsWrap.querySelector('button').addEventListener('click', ()=>{ state.confirmDeleteId = e.id; render(); });
    }
    row.appendChild(actionsWrap);
  }

  return row;
}

/* ---------- MODAL: ADD TRANSACTION ---------- */
function openModal(){
  state.modalOpen = true;
  state.form = { type:'penjualan', date: todayStr(), category: SALE_CATS[0], desc:'', modal:'', jual:'', amount:'' };
  render();
}
function closeModal(){ state.modalOpen = false; render(); }

function renderModal(){
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'modalOverlay';
  const f = state.form;

  const typeDefs = [
    {key:'penjualan', label:'Penjualan'},
    {key:'pengeluaran', label:'Pengeluaran'},
    {key:'modal_masuk', label:'Setor Modal'},
    {key:'modal_keluar', label:'Ambil Kas'},
  ];

  let fieldsHtml = '';
  if(f.type==='penjualan'){
    fieldsHtml = `
      <label class="field-label">Kategori Produk</label>
      <select class="field-select" id="fCategory">
        ${SALE_CATS.map(c=>`<option value="${c}" ${f.category===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <label class="field-label">Keterangan (opsional)</label>
      <input class="field-input" id="fDesc" type="text" placeholder="Contoh: Telkomsel 20.000 a.n. Budi" value="${f.desc}">
      <label class="field-label">Harga Modal</label>
      <input class="field-input mono" id="fModal" type="number" placeholder="0" value="${f.modal}">
      <label class="field-label">Harga Jual (diterima dari pembeli)</label>
      <input class="field-input mono" id="fJual" type="number" placeholder="0" value="${f.jual}">
      <div class="laba-preview" id="labaPreview"><span>Laba transaksi ini</span><span class="mono">${rupiah((Number(f.jual)||0)-(Number(f.modal)||0))}</span></div>
    `;
  } else if(f.type==='pengeluaran'){
    fieldsHtml = `
      <label class="field-label">Kategori Pengeluaran</label>
      <select class="field-select" id="fCategory">
        ${EXPENSE_CATS.map(c=>`<option value="${c}" ${f.category===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <label class="field-label">Keterangan (opsional)</label>
      <input class="field-input" id="fDesc" type="text" placeholder="Contoh: Beli pulsa modal, bayar listrik" value="${f.desc}">
      <label class="field-label">Jumlah</label>
      <input class="field-input mono" id="fAmount" type="number" placeholder="0" value="${f.amount}">
    `;
  } else {
    fieldsHtml = `
      <label class="field-label">Keterangan (opsional)</label>
      <input class="field-input" id="fDesc" type="text" placeholder="${f.type==='modal_masuk' ? 'Contoh: Setor modal awal' : 'Contoh: Ambil untung bulanan'}" value="${f.desc}">
      <label class="field-label">Jumlah</label>
      <input class="field-input mono" id="fAmount" type="number" placeholder="0" value="${f.amount}">
    `;
  }

  overlay.innerHTML = `
    <div class="modal">
      <h3>Tambah Transaksi</h3>
      <div class="sub">Catat transaksi baru ke buku kas usaha Anda.</div>
      <div class="type-grid" id="typeGrid"></div>
      <label class="field-label" style="margin-top:0">Tanggal</label>
      <input class="field-input" id="fDate" type="date" value="${f.date}">
      ${fieldsHtml}
      <div class="modal-actions">
        <button class="btn btn-outline btn-full" id="btnCancel">Batal</button>
        <button class="btn btn-accent btn-full" id="btnSave" ${state.saving?'disabled':''}>${state.saving?'Menyimpan…':'Simpan'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const typeGrid = overlay.querySelector('#typeGrid');
  typeDefs.forEach(td=>{
    const btn = document.createElement('button');
    btn.className = 'type-opt' + (f.type===td.key ? ' active' : '');
    btn.textContent = td.label;
    btn.addEventListener('click', ()=>{
      f.type = td.key;
      f.category = td.key==='penjualan' ? SALE_CATS[0] : (td.key==='pengeluaran' ? EXPENSE_CATS[0] : '');
      overlay.remove();
      renderModal();
    });
    typeGrid.appendChild(btn);
  });

  overlay.querySelector('#fDate').addEventListener('input', e=>{ f.date = e.target.value; });
  const cSel = overlay.querySelector('#fCategory');
  if(cSel) cSel.addEventListener('change', e=>{ f.category = e.target.value; });
  const dDesc = overlay.querySelector('#fDesc');
  if(dDesc) dDesc.addEventListener('input', e=>{ f.desc = e.target.value; });
  const mIn = overlay.querySelector('#fModal');
  const jIn = overlay.querySelector('#fJual');
  if(mIn) mIn.addEventListener('input', e=>{ f.modal = e.target.value; updateLabaPreview(); });
  if(jIn) jIn.addEventListener('input', e=>{ f.jual = e.target.value; updateLabaPreview(); });
  const aIn = overlay.querySelector('#fAmount');
  if(aIn) aIn.addEventListener('input', e=>{ f.amount = e.target.value; });

  overlay.querySelector('#btnCancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  overlay.querySelector('#btnSave').addEventListener('click', ()=>saveForm());

  function updateLabaPreview(){
    const lp = document.getElementById('labaPreview');
    if(lp) lp.querySelector('span.mono').textContent = rupiah((Number(f.jual)||0)-(Number(f.modal)||0));
  }
}

async function saveForm(){
  const f = state.form;
  if(!f.date){ toast('Tanggal wajib diisi'); return; }

  let entry = { type: f.type, date: f.date, description: f.desc.trim() || null };

  if(f.type==='penjualan'){
    const modal = Number(f.modal)||0, jual = Number(f.jual)||0;
    if(jual<=0){ toast('Isi harga jual terlebih dahulu'); return; }
    entry.category = f.category; entry.modal = modal; entry.jual = jual; entry.amount = 0;
  } else if(f.type==='pengeluaran'){
    const amount = Number(f.amount)||0;
    if(amount<=0){ toast('Isi jumlah pengeluaran'); return; }
    entry.category = f.category; entry.amount = amount; entry.modal = 0; entry.jual = 0;
  } else {
    const amount = Number(f.amount)||0;
    if(amount<=0){ toast('Isi jumlah nominal'); return; }
    entry.amount = amount; entry.modal = 0; entry.jual = 0;
  }

  state.saving = true; render();
  const ok = await insertEntry(entry);
  state.saving = false;

  if(ok){
    toast('Transaksi tersimpan');
    state.modalOpen = false;
    await loadEntries();
  } else {
    render();
  }
}

document.getElementById('fabAdd').addEventListener('click', openModal);

initAuth();
</script>
